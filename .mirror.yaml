repos:
  - source: https://github.com/George-Ogden/mirror-config
    files:
      - .mirror.yaml: python.mirror.yaml

      - .github/workflows/lint.yaml
      - .github/workflows/release.yaml: .github/python-release.yaml
      - .github/workflows/test.yaml: .github/python-test.yaml

      - README.md: template-README.md
      - LICENSE
      - version.txt

      - .gitignore: python.gitignore
      - .pre-commit-config.yaml: python.pre-commit-config.yaml

      - mypy.ini
      - pyproject.toml
      - pytest.ini
      - requirements.txt
      - requirements-dev.txt
      - ruff.toml

      - requirements-docs.txt
      - mkdocs.yaml: mkdocs-template.yaml
      - docs/index.md: docs-placeholder.md
      - .github/workflows/docs.yaml: .github/python-docs.yaml
      - .github/workflows/pypi-publish.yaml: .github/pypi-publish.yaml
